<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./rmeet-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rmeet — video meetings for teams, powered by WebRTC" />
    <title>Rmeet</title>
    <style>
      /* Visible boot state — an empty dark page before React mounts reads as
         a dead black screen on slow connections (mobile WebView). */
      #boot-loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #111118; color: #9aa0b4; z-index: 9999;
        font-family: 'Segoe UI', Roboto, sans-serif;
      }
      #boot-loading .spin {
        width: 38px; height: 38px; border-radius: 50%;
        border: 4px solid #2a2a35; border-top-color: #2f6fed;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="./index-B5wImWz2.js"></script>
    <link rel="stylesheet" crossorigin href="./index-C47zSrXT.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-loading">
      <div class="spin"></div>
      <div style="font-size: 14px;">Loading Rmeet…</div>
      <div style="font-size: 11px; color: #666; margin-top: 10px;">Build: 2026-11-11 09:38</div>
      <div id="boot-problem" style="display:none; max-width: 400px; text-align:center; font-size:12px; color:#d88;"></div>
      <button id="boot-reload" onclick="location.reload()" style="display:none; background:#2f6fed; color:#fff; border:0; border-radius:10px; padding:10px 24px; font-size:14px; cursor:pointer;">Reload app</button>
    </div>
    <script>
      // Boot watchdog: if the app hasn't mounted after 20s, something crashed
      // before React could render. Show the recorded JS error (if any) so the
      // failure is diagnosable from the screen itself.
      setTimeout(function () {
        var boot = document.getElementById('boot-loading');
        if (!boot) return; // app mounted fine
        var msg = 'The app is taking too long to start.';
        try {
          var e = JSON.parse(localStorage.getItem('rmeet.lastError') || 'null');
          if (e && e.detail) msg = 'Error: ' + e.detail + ' (' + e.at + ')';
        } catch (err) {}
        document.querySelector('#boot-loading .spin').style.display = 'none';
        var p = document.getElementById('boot-problem');
        p.textContent = msg;
        p.style.display = 'block';
        document.getElementById('boot-reload').style.display = 'inline-block';
      }, 20000);
    </script>
  </body>
</html>
